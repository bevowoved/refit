[workspace]
members = [".", "xtask"]
default-members = ["."]
resolver = "3"

[package]
name = "refit"
version = "0.6.0"
edition = "2024"
rust-version = "1.100"
description = "Give coding agents local neural hygiene, symbol-graph untangling, web-wired MCP, <5 ms hooks, and Kane CLI live proof."
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://bevowoved.github.io/refit/"
repository = "https://github.com/bevowoved/refit"
keywords = ["code-hygiene", "untangle", "mcp", "refactor", "verification"]
categories = ["command-line-utilities", "development-tools"]
include = ["Cargo.toml", "Cargo.lock", "README.md", "src/**", "skills/refit/SKILL.md", "vendor/codehygiene/weights.npz", "plugin.json", "mcp.json"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[features]
default = ["alloc-mimalloc"]
alloc-mimalloc = ["dep:mimalloc"]
alloc-jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
wal-crc32c = []
sst-storage = []
live-rewind = []
doc-drift = []
ste100 = []
build-cache = ["dep:reflink-copy"]
full = [
  "wal-crc32c",
  "sst-storage",
  "live-rewind",
  "doc-drift",
  "ste100",
  "build-cache",
]

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.105"
axum = "0.8.9"
bitflags = "2.13.2"
blake3 = "1.8.7"
bstr = "1.14.0"
bytes = "1.12.2"
clap = { version = "4.6.10", features = ["derive", "env"] }
crc32c = "0.6.9"
dunce = "1.0.5"
fixedbitset = "0.5.9"
flate2 = "1.1"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc", "std"] }
getrandom = "0.4.3"
globset = "0.4.22"
httpdate = "1.0"
ignore = "0.4.35"
memchr = "2.8.3"
mimalloc = { version = "0.1.52", optional = true }
parking_lot = "0.13.0"
postcard = { version = "1.2.0", default-features = false, features = ["alloc"] }
quick_cache = { version = "0.7.0", default-features = false }
rawzip = "0.5.3"
rayon = "1.12.0"
reflink-copy = { version = "0.1.33", optional = true }
regex = { version = "1.13.2", default-features = false, features = ["std", "perf"] }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls", "stream", "gzip", "json"] }
rustc-hash = "2.1.3"
same-file = "1.0.6"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shlex = "2.0.1"
similar = "3.2"
smallvec = "1.16.6"
strsim = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-std", "io-util"] }
toml = { version = "1.2.3", default-features = false, features = ["parse", "serde", "std"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }
url = "2.5.9"
wait-timeout = "0.2"
walkdir = "2.5.1"
zstd = { version = "0.14.5", features = ["with-rust-allocator"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.7.0", optional = true }
tikv-jemalloc-ctl = { version = "0.7.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1.6", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
] }

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = true

[profile.test.package."*"]
debug = false
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "symbols"
panic = "abort"

[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
