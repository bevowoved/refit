[package]
name = "refit"
version = "0.5.0"
edition = "2024"
description = "Pure-Rust cross-platform polyglot refactoring engine for Kimi K3.1 Pro on Cerebras + unpatched OpenClaw + native 10 req/s KeenAble ROI search"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
blake3 = "1.8.7"
bytes = "1.12.2"
clap = { version = "4.6.9", features = ["derive"] }
dashmap = "6.2.1"
flate2 = "1.1"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc", "std"] }
governor = { version = "0.10.4", default-features = false, features = ["std"] }
httpdate = "1.0"
ignore = "0.4.35"
mimalloc = "0.1.52"
parking_lot = "0.12"
petgraph = "0.8.3"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls", "stream", "gzip", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-std", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }
wait-timeout = "0.2"
zstd = "0.14.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["process", "signal", "resource"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
] }

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = true

[profile.test.package."*"]
debug = false
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
