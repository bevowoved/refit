[package]
name = "refit"
version = "0.5.0"
edition = "2024"
rust-version = "1.100"
description = "Pure-Rust cross-platform polyglot refactoring engine for Kimi K3.1 Pro on Cerebras + unpatched OpenClaw + native 10 req/s KeenAble ROI search"

[features]
default = ["alloc-mimalloc"]
alloc-mimalloc = ["dep:mimalloc"]
alloc-jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
live-rewind = []
doc-drift = []

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.105"
axum = "0.8.9"
blake3 = "1.8.7"
bytes = "1.12.2"
clap = { version = "4.6.9", features = ["derive"] }
constant_time_eq = "0.4.2"
dunce = "1.0.5"
fixedbitset = "0.5.9"
flate2 = "1.1"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc", "std"] }
globset = "0.4.22"
governor = { version = "0.10.4", default-features = false, features = ["std"] }
httpdate = "1.0"
ignore = "0.4.35"
lz4_flex = { version = "0.11", default-features = false }
memchr = "2.8.3"
mimalloc = { version = "0.1.52", optional = true }
parking_lot = "0.12"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls", "stream", "gzip", "json"] }
rustc-hash = "2.1.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shlex = "2.0.1"
similar = "3.2"
strsim = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-std", "io-util"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }
url = "2.5.9"
wait-timeout = "0.2"
zstd = { version = "0.14.4", features = ["with-rust-allocator"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }
tikv-jemalloc-ctl = { version = "0.6", optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs", "process", "signal", "resource"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
] }

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = true

[profile.test.package."*"]
debug = false
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
