name: Cross-Platform Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: "--no-default-features --features alloc-jemalloc,full"
            bin: refit
          - os: macos-latest
            target: aarch64-apple-darwin
            features: "--features full"
            bin: refit
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: "--features full"
            bin: refit.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          targets: ${{ matrix.target }}
      - name: Verify single-version lockfile
        shell: bash
        run: |
          dups=$(cargo tree --locked ${{ matrix.features }} -e normal --duplicates)
          test -z "$dups"
      - name: Run full test suite
        run: cargo test --locked ${{ matrix.features }}
      - name: Build release binary
        run: cargo build --release --locked ${{ matrix.features }} --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refit-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist

      - name: Package archives and SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          chmod +x dist/refit-x86_64-unknown-linux-gnu/refit dist/refit-aarch64-apple-darwin/refit
          tar -czf release-assets/refit-x86_64-unknown-linux-gnu.tar.gz -C dist/refit-x86_64-unknown-linux-gnu refit
          tar -czf release-assets/refit-aarch64-apple-darwin.tar.gz -C dist/refit-aarch64-apple-darwin refit
          (cd dist/refit-x86_64-pc-windows-msvc && zip -q ../../release-assets/refit-x86_64-pc-windows-msvc.zip refit.exe)
          (cd release-assets && sha256sum refit-* > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "refit $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
