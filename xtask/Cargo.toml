[package]
name = "xtask"
version = "0.6.0"
edition = "2024"
rust-version = "1.100"
publish = false

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
walkdir = "2.5.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }
